# ===================================================================
# ChronoTrack Backend Configuration
# ===================================================================

# Server Port
server.port=${SERVER_PORT:8080}

# Application Name
spring.application.name=chronotrack-backend

# PostgreSQL Database Configuration
# Uses environment variables with sensible local defaults
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chronotrack_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Secret & Expiration Configuration (24 hours = 86400000 ms)
# JWT secret can be overridden in production via environment variable JWT_SECRET
chronotrack.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
chronotrack.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging configuration
logging.level.com.chronotrack=INFO
logging.level.org.springframework.security=WARN
